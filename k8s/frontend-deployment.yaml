apiVersion: apps/v1
kind: Deployment
metadata:
  name: comptoir-frontend
  namespace: comptoir
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comptoir-frontend
  template:
    metadata:
      labels:
        app: comptoir-frontend
    spec:
      containers:
        - name: frontend
          image: comptoir-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: comptoir-frontend
  namespace: comptoir
spec:
  selector:
    app: comptoir-frontend
  ports:
    - port: 80
      targetPort: 80
  type: NodePort